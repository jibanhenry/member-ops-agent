# 会员运营 Playbook —— 结构化的运营规则
# Agent 的判断和建议都从这里取，改这个文件就能改变产品的"运营思想"，无需改代码。
# 修改后重新运行管线：uv run python -m member_ops.pipeline
# （高频商超版见 playbook_supermarket.yaml）

# ---------- 生命周期阶段判定（按顺序匹配，命中即停） ----------
# 阈值取决于业态的消费频率。当前是百货商场高端美妆专柜的设置：
# 会员 21 个月里有消费的天数中位数只有 2 天，客单价约 1500 元，属于低频高客单。
# 商场以美妆专柜为主，也有钟表、箱包、电器等柜台，策略里的"专属导购"在美妆专柜即美容顾问。
# 咖啡/茶饮/商超等高频业态需要把天数大幅调小。
# 判定顺序：流失 -> 沉睡 -> 新客期 -> 单次客 -> 衰退预警 -> 成长期 -> 成熟期
lifecycle:
  lost_recency_days: 365       # 超过 N 天未消费 -> 流失
  dormant_recency_days: 180    # 超过 N 天未消费 -> 沉睡
  new_tenure_days: 90          # 入会（无入会时间则按首次消费）在 N 天内 -> 新客期
  one_time_max_days: 1         # 过了新客期、有消费的天数 <= N -> 单次客（还没有过第二次到柜）
  at_risk_churn_prob: 0.6      # 半年流失概率 >= 该值 -> 衰退预警
  at_risk_gap_ratio: 2.0       # 沉默时长 >= 平均消费间隔 × 该值 -> 衰退预警
  growing_max_orders: 3        # 累计消费 <= N 次且未预警 -> 成长期；否则成熟期

# 顺序即看板上的展示顺序
stage_names:
  new: 新客期
  one_time: 单次客
  growing: 成长期
  mature: 成熟期
  at_risk: 衰退预警
  dormant: 沉睡
  lost: 流失

# ---------- 价值分层 ----------
# 只看历史累计消费，会把"以前买很多、现在已经不来"的会员算成高价值。
# blend 按 历史排名 与 预测未来一年消费排名 加权，更贴近"值得为他花多少钱"。
value_tiers:
  basis: blend          # history=只看历史累计消费；predicted=只看预测未来一年消费；blend=两者加权
  predicted_weight: 0.5 # blend 时预测价值的权重
  high_top_pct: 0.2     # 前 20% -> 高价值
  mid_top_pct: 0.5      # 20%~50% -> 中价值，其余低价值
  shift_gap: 0.4        # 历史排名与预测排名相差超过该比例 -> 标记"价值下滑"或"潜力上升"

tier_names:
  high: 高价值
  mid: 中价值
  low: 低价值

# ---------- 补货节奏 ----------
# 补货提醒按会员自己的节奏触发：消费天数够多用个人平均间隔，否则用主力品牌的同客复购间隔中位数。
replenishment:
  personal_min_days: 3   # 有消费的天数 >= N 才用个人平均间隔
  remind_at: 0.75        # 周期走到 75% 时提醒（用完之前，而不是用完之后）
  window_days: 14        # "补货窗口"：未来 N 天内到提醒日，或已过提醒日但还没超过 1.25 个周期
  min_cycle_days: 21
  max_cycle_days: 180
  brand_min_pairs: 200   # 品牌至少有 N 次同客复购记录才用品牌周期，否则用整体中位数

# ---------- 权益选择 ----------
# 从不用券的会员发券，钱补贴给了本来就会买的人；只有价格敏感的会员才给让利型权益。
incentive_rules:
  price_sensitive_discount_rate: 0.02  # 历史优惠占原价比例 >= 该值 -> 价格敏感
  price_sensitive_coupon_share: 0.3    # 用券订单占比 >= 该值 -> 价格敏感（数据里有用券记录时）

# ---------- 触达编排 ----------
# 每位会员同一时间只执行一个"下一步动作"；人工回访是稀缺资源，按风险金额排队。
contact_policy:
  max_touches_per_week: 1      # 每位会员每周最多被主动触达 1 次（跨所有策略）
  max_touches_per_month: 3
  manual_capacity_per_week: 300 # 导购每周能完成的人工回访总数，按"导购人数 × 人均通数"填写
  manual_max_weeks: 4           # 人工回访最多排 N 周，排不进去的转自动触达
  manual_stage_priority: [at_risk, one_time, growing, dormant]  # 人工排队先按阶段：衰退预警最先，越早拦截越划算；同阶段按风险金额
  promo_quiet_days: 14          # 大促开始前 N 天内，自动挽留/唤醒并入大促统一推送，不单独让利

# ---------- 大促日历（月-日） ----------
# 用来安排触达时机，请替换成本商场的实际档期（春节等农历节日按当年日期调整）。
# 演示数据里 11 月收入占全年 15%、9 月 12%，2 月只有 3%。
calendar:
  - {name: 年货节, start: "01-10", end: "02-10"}
  - {name: 三八女神节, start: "03-01", end: "03-08"}
  - {name: 年中大促, start: "05-15", end: "06-18"}
  - {name: 中秋国庆, start: "09-15", end: "10-07"}
  - {name: 双十一, start: "11-01", end: "11-15"}
  - {name: 双十二与跨年, start: "12-10", end: "12-31"}

# ---------- 运营策略：阶段 × 价值 -> 动作 ----------
# tier: high / mid / low / any。匹配时优先精确 tier，其次 any。
# channel: manual=导购人工（受产能约束）/ auto=自动触达 / promo_only=只在大促触达
# cost_cap_pct: 单人权益成本上限 = 预测未来一年消费 × 该比例
# incentive 是默认权益（给不价格敏感的会员），incentive_price_sensitive 给价格敏感的会员
strategies:
  - stage: new
    tier: any
    name: 入会 90 天首次体验闭环
    goal: 让新会员完成第二次到柜，美妆的第二次购买通常是补货或同系列加购
    channel: auto
    cost_cap_pct: 0.05
    actions:
      - 入会当天：专属导购（美妆专柜为美容顾问）添加企业微信，发送积分规则和会员权益说明
      - 首购后第 7 天：回访使用感受，提醒正确用法，避免因用法不当放弃
      - 按首购品牌的补货周期，在周期 75% 时提醒补货，附同系列小样
      - 入会第 60 天仍未复购：邀请参加专柜新品体验或妆容课
    incentive: 小样、体验服务，不发折扣券
    incentive_price_sensitive: 第二单满赠，30 天内有效
    kpi: 入会 90 天内二次购买率
    guardrail: 90 天内最多主动触达 4 次；已复购即转入成长期节奏

  - stage: one_time
    tier: high
    name: 首单大客二次到柜
    goal: 首单就买得多但只来过一次，是最值得争取第二单的人
    channel: manual
    cost_cap_pct: 0.08
    actions:
      - 导购按首单品牌回访使用感受，确认是否适合肤质，必要时邀请到柜调整方案
      - 按首单品牌的补货周期，在周期 75% 时提醒补货
      - 邀请参加首单品牌的新品体验或妆容课
    incentive: 到柜体验、同系列小样
    incentive_price_sensitive: 第二单满赠或积分加倍，限 30 天内使用
    kpi: 60 天内二次到柜率
    guardrail: 人工回访只做一次；30 天内最多触达 2 次

  - stage: one_time
    tier: any
    name: 单次客第二单激活
    goal: 这批人从没形成过习惯，目标不是"挽留"而是促成第二单
    channel: auto
    cost_cap_pct: 0.05
    actions:
      - 按首单品牌的补货周期发送补货提醒和正确用法内容
      - 告知积分余额和可兑换的小样
      - 30 天未响应：推送一次首单品牌的新品或套装
    incentive: 积分兑换小样
    incentive_price_sensitive: 第二单满减，限 30 天内使用
    kpi: 90 天内二次到柜率
    guardrail: 30 天内最多触达 2 次；仍无响应的转入大促节点统一触达

  - stage: growing
    tier: high
    name: 高潜会员升级
    goal: 首几单就买得多的会员，尽快培养成多品牌、稳定复购的核心会员
    channel: manual
    cost_cap_pct: 0.05
    actions:
      - 指定专属导购，建立一对一联系
      - 邀请参加品牌 VIP 沙龙、新品首发
      - 推荐与已购品牌互补的品类（如护肤客推荐彩妆、香水）
    incentive: 会员等级/积分加速，突出身份感
    kpi: 180 天内消费次数、跨品牌购买数
    guardrail: 不用大额折扣拉升，避免养成只在大促时购买

  - stage: growing
    tier: any
    name: 补货节奏培养
    goal: 让会员形成按周期回柜补货的习惯
    channel: auto
    cost_cap_pct: 0.03
    actions:
      - 按会员自己的消费间隔（不足 3 次用品牌周期）在周期 75% 时提醒补货
      - 推荐常用单品的套装或大容量装
    incentive: 满额赠小样
    incentive_price_sensitive: 积分加倍日、满额赠小样
    kpi: 复购间隔是否缩短
    guardrail: 同一会员每月最多 2 次营销触达；不在补货窗口内不打扰

  - stage: mature
    tier: high
    name: 核心会员维系
    goal: 维持忠诚度和钱包份额，不打扰
    channel: auto
    cost_cap_pct: 0.03
    actions:
      - 生日、入会纪念日由专属导购送祝福和礼遇
      - 新品优先试用、限量品预留
      - 淡季（2~3 月）邀请参加商场 VIP 活动，收集反馈；淡季导购有空，也避开大促让利
    incentive: 非金钱权益优先（身份、体验、优先权）
    kpi: 年度留存率、年消费额、跨品牌数
    guardrail: 不发大额通用券，避免利润侵蚀

  - stage: mature
    tier: any
    name: 跨品牌连带推荐
    goal: 提高连带率和购买品牌数；只买一个品牌的会员是"专柜的客人"，多品牌才是"商场的客人"
    channel: auto
    cost_cap_pct: 0.02
    actions:
      - 基于常买品牌推荐关联品牌或品类（护肤→彩妆、香水、个护）
      - 店庆、节日营销时优先触达
    incentive: 跨品牌满额赠、积分兑换
    incentive_price_sensitive: 跨品牌满减、积分兑换
    kpi: 连带率、购买品牌数、客单价
    guardrail: 推荐要与历史偏好相关，避免无差别群发

  - stage: at_risk
    tier: high
    name: 高价值衰退预警挽留
    goal: 在真正流失前拦截，这是投入产出比最高的人群
    channel: manual
    cost_cap_pct: 0.10
    actions:
      - 专属导购 48 小时内电话或企业微信回访，了解是否转去其他渠道
      - 有投诉或不满的先解决问题再谈礼遇
      - 邀请到柜做一次新品体验（美妆可安排免费护理）
    incentive: 定向礼遇（体验、护理、限量品预留）
    incentive_price_sensitive: 定向礼遇 + 到柜满赠
    kpi: 60 天内回柜率、挽留 ROI
    guardrail: 人工优先于群发；同一会员一个周期内只做一次大额挽留

  - stage: at_risk
    tier: any
    name: 衰退预警自动唤醒
    goal: 低成本拉回消费节奏
    channel: auto
    cost_cap_pct: 0.03
    actions:
      - 发送补货提醒和积分余额/到期提醒
      - 14 天未响应再推一次新品或套装内容
    incentive: 小样、积分兑换
    incentive_price_sensitive: 积分加倍、满赠
    kpi: 30 天内回柜率
    guardrail: 低价值人群控制成本，优先用积分和内容；临近大促的并入大促推送

  - stage: dormant
    tier: high
    name: 高价值沉睡会员召回
    goal: 用新鲜感和专属感召回
    channel: manual
    cost_cap_pct: 0.05
    actions:
      - 告知其常买品牌的新品或专柜升级
      - 发放"老会员回归礼"，邀请到柜体验
      - 回访了解离开原因，记录到会员档案
    incentive: 回归礼（体验或小样礼盒）
    incentive_price_sensitive: 回归礼 + 到柜满减
    kpi: 90 天召回率
    guardrail: 召回失败的不再追加投入，转入低频内容触达

  - stage: dormant
    tier: any
    name: 沉睡会员批量唤醒
    goal: 筛出仍有意愿的会员
    channel: auto
    cost_cap_pct: 0.02
    actions:
      - 店庆、双十一、年货节等大促节点统一推送一次
      - 对打开或点击的会员再做二次精准触达
    incentive: 积分兑换
    incentive_price_sensitive: 积分兑换、通用满减
    kpi: 触达响应率、召回率
    guardrail: 控制频率，避免被投诉为骚扰

  - stage: lost
    tier: any
    name: 流失会员低成本维系
    goal: 不再重投入，保留重新激活的可能
    channel: promo_only
    cost_cap_pct: 0.0
    actions:
      - 仅在年度大促时触达
      - 分析流失原因，反哺商品和服务改进
    incentive: 无或极低
    kpi: 流失原因归因覆盖率
    guardrail: 不对流失会员做高成本投放
