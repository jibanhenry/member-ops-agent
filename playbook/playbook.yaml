# 会员运营 Playbook —— 结构化的运营规则
# Agent 的判断和建议都从这里取，改这个文件就能改变产品的"运营思想"，无需改代码。
# 修改后重新运行管线：uv run python -m member_ops.pipeline
# （高频商超版见 playbook_supermarket.yaml）

# ---------- 生命周期阶段判定（按顺序匹配，命中即停） ----------
# 阈值取决于业态的消费频率。当前是百货商场高端美妆专柜的设置：
# 会员 21 个月里有消费的天数中位数只有 2 天，客单价约 1500 元，属于低频高客单。
# 商场以美妆专柜为主，也有钟表、箱包、电器等柜台，策略里的"专属导购"在美妆专柜即美容顾问。
# 咖啡/茶饮/商超等高频业态需要把天数大幅调小。
lifecycle:
  lost_recency_days: 365       # 超过 N 天未消费 -> 流失
  dormant_recency_days: 180    # 超过 N 天未消费 -> 沉睡
  new_tenure_days: 90          # 入会（无入会时间则按首次消费）在 N 天内 -> 新客期
  at_risk_churn_prob: 0.6      # 半年流失概率 >= 该值 -> 衰退预警
  at_risk_gap_ratio: 2.0       # 沉默时长 >= 平均消费间隔 × 该值 -> 衰退预警
  growing_max_orders: 3        # 累计消费 <= N 次且未预警 -> 成长期；否则成熟期

stage_names:
  new: 新客期
  growing: 成长期
  mature: 成熟期
  at_risk: 衰退预警
  dormant: 沉睡
  lost: 流失

# ---------- 价值分层（按历史累计消费排名） ----------
value_tiers:
  high_top_pct: 0.2   # 前 20% -> 高价值
  mid_top_pct: 0.5    # 20%~50% -> 中价值，其余低价值

tier_names:
  high: 高价值
  mid: 中价值
  low: 低价值

# ---------- 运营策略：阶段 × 价值 -> 动作 ----------
# tier: high / mid / low / any。匹配时优先精确 tier，其次 any。
strategies:
  - stage: new
    tier: any
    name: 入会 90 天首次体验闭环
    goal: 让新会员完成第二次到柜，美妆的第二次购买通常是补货或同系列加购
    actions:
      - 入会当天：专属导购（美妆专柜为美容顾问）添加企业微信，发送积分规则和会员权益说明
      - 首购后第 7 天：回访使用感受，提醒正确用法，避免因用法不当放弃
      - 首购后第 30~45 天：按首购单品的使用周期提醒补货，附同系列小样
      - 入会第 60 天仍未复购：邀请参加专柜新品体验或妆容课
    incentive: 小样、体验服务优先于折扣；如需让利，第二单满赠
    kpi: 入会 90 天内二次购买率
    guardrail: 90 天内最多主动触达 4 次；已复购即转入成长期节奏

  - stage: growing
    tier: high
    name: 高潜会员升级
    goal: 首几单就买得多的会员，尽快培养成多品牌、稳定复购的核心会员
    actions:
      - 指定专属导购，建立一对一联系
      - 邀请参加品牌 VIP 沙龙、新品首发
      - 推荐与已购品牌互补的品类（如护肤客推荐彩妆、香水）
    incentive: 会员等级/积分加速，突出身份感
    kpi: 180 天内消费次数、跨品牌购买数
    guardrail: 不用大额折扣拉升，避免养成只在大促时购买

  - stage: growing
    tier: any
    name: 补货节奏培养
    goal: 让会员形成按周期回柜补货的习惯
    actions:
      - 按其已购单品的使用周期（如护肤品约 60~90 天）做到期提醒
      - 推荐常用单品的套装或大容量装
    incentive: 积分加倍日、满额赠小样
    kpi: 复购间隔是否缩短
    guardrail: 同一会员每月最多 2 次营销触达

  - stage: mature
    tier: high
    name: 核心会员维系
    goal: 维持忠诚度和钱包份额，不打扰
    actions:
      - 生日、入会纪念日由专属导购送祝福和礼遇
      - 新品优先试用、限量品预留
      - 定期邀请参加商场 VIP 活动，收集反馈
    incentive: 非金钱权益优先（身份、体验、优先权）
    kpi: 年度留存率、年消费额、跨品牌数
    guardrail: 不发大额通用券，避免利润侵蚀

  - stage: mature
    tier: any
    name: 跨品牌连带推荐
    goal: 提高连带率和购买品牌数
    actions:
      - 基于常买品牌推荐关联品牌或品类（护肤→彩妆、香水、个护）
      - 店庆、节日营销时优先触达
    incentive: 跨品牌满额赠、积分兑换
    kpi: 连带率、购买品牌数、客单价
    guardrail: 推荐要与历史偏好相关，避免无差别群发

  - stage: at_risk
    tier: high
    name: 高价值衰退预警挽留
    goal: 在真正流失前拦截，这是投入产出比最高的人群
    actions:
      - 专属导购 48 小时内电话或企业微信回访，了解是否转去其他渠道
      - 有投诉或不满的先解决问题再谈礼遇
      - 邀请到柜做一次新品体验（美妆可安排免费护理）
    incentive: 定向礼遇，单人成本不超过其流失风险金额（流失概率 × 年消费）的 30%
    kpi: 60 天内回柜率、挽留 ROI
    guardrail: 人工优先于群发；同一会员一个周期内只做一次大额挽留

  - stage: at_risk
    tier: any
    name: 衰退预警自动唤醒
    goal: 低成本拉回消费节奏
    actions:
      - 发送补货提醒和积分余额/到期提醒
      - 14 天未响应再推一次积分加倍或满赠
    incentive: 积分加倍、小样
    kpi: 30 天内回柜率
    guardrail: 低价值人群控制成本，优先用积分和内容

  - stage: dormant
    tier: high
    name: 高价值沉睡会员召回
    goal: 用新鲜感和专属感召回
    actions:
      - 告知其常买品牌的新品或专柜升级
      - 发放"老会员回归礼"，邀请到柜体验
      - 回访了解离开原因，记录到会员档案
    incentive: 回归礼，成本上限参考其历史年均消费的 3%
    kpi: 90 天召回率
    guardrail: 召回失败的不再追加投入，转入低频内容触达

  - stage: dormant
    tier: any
    name: 沉睡会员批量唤醒
    goal: 筛出仍有意愿的会员
    actions:
      - 店庆、双十一、年货节等大促节点统一推送一次
      - 对打开或点击的会员再做二次精准触达
    incentive: 积分兑换、通用满减
    kpi: 触达响应率、召回率
    guardrail: 控制频率，避免被投诉为骚扰

  - stage: lost
    tier: any
    name: 流失会员低成本维系
    goal: 不再重投入，保留重新激活的可能
    actions:
      - 仅在年度大促时触达
      - 分析流失原因，反哺商品和服务改进
    incentive: 无或极低
    kpi: 流失原因归因覆盖率
    guardrail: 不对流失会员做高成本投放
